<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Detalhes da Medição | Orçamento Rápido
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/medicoes.css"
    >

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet"
    >

</head>


<body>


<main class="detalhes-pagina">


    <div class="detalhes-topo">


        <a
            href="medicoes.html"
            class="btn-voltar"
        >

            <i class="bx bx-arrow-back"></i>

            Voltar

        </a>


        <div>

            <span>
                ORÇAMENTO RÁPIDO
            </span>

            <h1>
                Detalhes da medição
            </h1>

        </div>


    </div>



    <section
        id="carregandoDetalhes"
        class="detalhes-card"
    >

        Carregando medição...

    </section>



    <div
        id="conteudoDetalhes"
        class="oculto"
    >


        <section class="detalhes-card">


            <div class="detalhes-cabecalho">


                <div>

                    <span>
                        MEDIÇÃO
                    </span>

                    <h2 id="detalheContrato">
                        -
                    </h2>

                </div>


                <span
                    id="detalheStatus"
                    class="status-medicao"
                >
                    -
                </span>


            </div>



            <div class="detalhes-grid">


                <div>

                    <span>
                        Prestador
                    </span>

                    <strong id="detalhePrestador">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Data do serviço
                    </span>

                    <strong id="detalheData">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Cidade
                    </span>

                    <strong id="detalheCidade">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Localidade
                    </span>

                    <strong id="detalheLocalidade">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Responsável
                    </span>

                    <strong id="detalheResponsavel">
                        -
                    </strong>

                </div>


                <div>

                    <span>
                        Criado por
                    </span>

                    <strong id="detalheCriadoPor">
                        -
                    </strong>

                </div>


            </div>



            <div class="detalhe-descricao">

                <span>
                    Descrição
                </span>

                <p id="detalheDescricao">
                    -
                </p>

            </div>


        </section>



        <section class="detalhes-card">


            <div class="titulo-secao">

                <h3>
                    Serviços executados
                </h3>

                <span id="detalheQuantidadeItens">
                    0 itens
                </span>

            </div>


            <div class="tabela-wrapper">


                <table class="tabela-itens">


                    <thead>

                        <tr>

                            <th>
                                Código
                            </th>

                            <th>
                                Serviço
                            </th>

                            <th>
                                Unidade
                            </th>

                            <th>
                                Quantidade
                            </th>

                            <th>
                                Valor unitário
                            </th>

                            <th>
                                Total
                            </th>

                        </tr>

                    </thead>


                    <tbody id="detalheItens"></tbody>


                </table>


            </div>


            <div class="detalhe-total">

                <span>
                    Valor total
                </span>

                <strong id="detalheValorTotal">
                    R$ 0,00
                </strong>

            </div>


        </section>


    </div>


</main>


<script
    type="module"
    src="../js/authGuard.js"
></script>

<script
    type="module"
    src="../js/detalhesMedicao.js"
></script>


</body>

</html>
